apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Production environment overlay for the ai-agent-ops platform.
# References the shared base and applies prod-specific patches:
#   - Deployment: 3 replicas with a larger resource footprint
#   - ConfigMap: LOG_LEVEL=WARNING (quieter logging for production)
namespace: ai-agent-ops

resources:
  - ../../base

patches:
  - path: deployment-patch.yaml
    target:
      kind: Deployment
      name: ai-agent-app
  - path: configmap-patch.yaml
    target:
      kind: ConfigMap
      name: ai-agent-config
