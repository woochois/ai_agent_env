apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-agent-app
  namespace: ai-agent-ops
spec:
  # Dev keeps the baseline of 2 replicas
  replicas: 2
  template:
    spec:
      containers:
        - name: ai-agent-app
          # Smaller resource footprint for local development
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
