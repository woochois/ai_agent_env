apiVersion: v1
kind: Service
metadata:
  name: ai-agent-app
  namespace: ai-agent-ops
  labels:
    app: ai-agent-ops
    component: api
    version: v1.0.0
spec:
  type: ClusterIP
  selector:
    app: ai-agent-ops
    component: api
  ports:
    - name: http
      protocol: TCP
      port: 80
      targetPort: 8000
