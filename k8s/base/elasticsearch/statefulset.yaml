# StorageClass with reclaimPolicy: Retain so the PersistentVolume (and its data)
# is preserved if the Elasticsearch Pod/PVC is deleted or terminates abnormally
# (Requirement 5.5). Uses the standard host-path provisioner available on
# Docker Desktop / minikube local clusters.
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: elasticsearch-retain
  labels:
    app: ai-agent-ops
    component: search
    version: v1.0.0
provisioner: docker.io/hostpath
reclaimPolicy: Retain
volumeBindingMode: WaitForFirstConsumer
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: elasticsearch
  namespace: ai-agent-ops
  labels:
    app: ai-agent-ops
    component: search
    version: v1.0.0
spec:
  serviceName: elasticsearch
  replicas: 1
  selector:
    matchLabels:
      app: ai-agent-ops
      component: search
  template:
    metadata:
      labels:
        app: ai-agent-ops
        component: search
        version: v1.0.0
      annotations:
        deploy-timestamp: "2024-01-15T09:30:00Z"
        app-version: v1.0.0
    spec:
      # Elasticsearch requires vm.max_map_count >= 262144. On Docker Desktop /
      # most local clusters this is already satisfied; an initContainer is added
      # for clusters where it is configurable.
      initContainers:
        - name: increase-vm-max-map-count
          image: busybox:1.36
          command: ["sh", "-c", "sysctl -w vm.max_map_count=262144 || true"]
          securityContext:
            privileged: true
      containers:
        - name: elasticsearch
          image: docker.elastic.co/elasticsearch/elasticsearch:8.13.4
          ports:
            - name: http
              containerPort: 9200
              protocol: TCP
            - name: transport
              containerPort: 9300
              protocol: TCP
          env:
            # Single-node discovery for a 1-replica deployment.
            - name: discovery.type
              value: single-node
            # Disable security (xpack) per spec for local/dev deployment.
            - name: xpack.security.enabled
              value: "false"
            # Constrain JVM heap to stay within container memory limits.
            - name: ES_JAVA_OPTS
              value: "-Xms512m -Xmx512m"
          resources:
            requests:
              cpu: 250m
              memory: 1Gi
            limits:
              cpu: 1000m
              memory: 2Gi
          readinessProbe:
            httpGet:
              path: /_cluster/health
              port: 9200
            initialDelaySeconds: 20
            periodSeconds: 10
            failureThreshold: 3
          volumeMounts:
            - name: elasticsearch-data
              mountPath: /usr/share/elasticsearch/data
  volumeClaimTemplates:
    - metadata:
        name: elasticsearch-data
        labels:
          app: ai-agent-ops
          component: search
          version: v1.0.0
      spec:
        accessModes:
          - ReadWriteOnce
        storageClassName: elasticsearch-retain
        resources:
          requests:
            storage: 2Gi
