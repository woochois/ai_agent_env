apiVersion: v1
kind: Service
metadata:
  name: elasticsearch
  namespace: ai-agent-ops
  labels:
    app: ai-agent-ops
    component: search
    version: v1.0.0
spec:
  type: ClusterIP
  selector:
    app: ai-agent-ops
    component: search
  ports:
    - name: http
      protocol: TCP
      port: 9200
      targetPort: 9200
