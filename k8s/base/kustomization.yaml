apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Common labels applied to all resources for k9s label-based filtering
labels:
  - pairs:
      app: ai-agent-ops
    includeSelectors: false

# Base resources for the ai-agent-ops platform.
resources:
  - namespace.yaml
  - resource-quota.yaml
  - limit-range.yaml
  - configmap.yaml
  - secret.yaml
  - deployment.yaml
  - service.yaml
  - hpa.yaml
  - postgres/secret.yaml
  - postgres/statefulset.yaml
  - postgres/service.yaml
  - elasticsearch/statefulset.yaml
  - elasticsearch/service.yaml
