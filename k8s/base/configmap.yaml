apiVersion: v1
kind: ConfigMap
metadata:
  name: ai-agent-config
  namespace: ai-agent-ops
  labels:
    app: ai-agent-ops
    component: api
    version: v1.0.0
data:
  # Log level. Allowed values: DEBUG | INFO | WARNING | ERROR
  LOG_LEVEL: "INFO"
  # Debug mode toggle. Allowed values: true | false
  DEBUG_MODE: "false"
  # Session time-to-live in hours (positive integer)
  SESSION_TTL_HOURS: "24"
