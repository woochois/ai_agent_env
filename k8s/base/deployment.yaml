apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-agent-app
  namespace: ai-agent-ops
  labels:
    app: ai-agent-ops
    component: api
    version: v1.0.0
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: ai-agent-ops
      component: api
  template:
    metadata:
      labels:
        app: ai-agent-ops
        component: api
        version: v1.0.0
      annotations:
        deploy-timestamp: "2024-01-15T09:30:00Z"
        app-version: v1.0.0
    spec:
      containers:
        - name: ai-agent-app
          image: ai-agent-ops:v1.0.0
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          envFrom:
            - configMapRef:
                name: ai-agent-config
            - secretRef:
                name: ai-agent-secrets
          env:
            - name: ANTHROPIC_API_KEY
              valueFrom:
                secretKeyRef:
                  name: ai-agent-secrets
                  key: ANTHROPIC_API_KEY
                  optional: true
            - name: GOOGLE_API_KEY
              valueFrom:
                secretKeyRef:
                  name: ai-agent-secrets
                  key: GOOGLE_API_KEY
                  optional: true
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 10
            failureThreshold: 3
