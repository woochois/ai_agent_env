apiVersion: v1
kind: LimitRange
metadata:
  name: ai-agent-ops-limits
  namespace: ai-agent-ops
  labels:
    app: ai-agent-ops
    component: platform
    version: v1.0.0
spec:
  limits:
    - type: Container
      default:
        cpu: 500m
        memory: 512Mi
      defaultRequest:
        cpu: 100m
        memory: 128Mi
