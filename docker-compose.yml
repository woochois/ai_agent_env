services:
  app:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
    volumes:
      - ./logs:/app/logs

  # graphql-server:
  #   build: ./graphql-server
  #   ports:
  #     - "4000:4000"
  #   environment:
  #     DATABASE_URL: postgres://user:password@postgres:5432/agent_db
  #     JWT_SECRET: ${JWT_SECRET:-playground-jwt-secret-key}
  #     JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-playground-refresh-secret-key}
  #     DOMAIN_SERVER_URL: http://app:8000
  #     PORT: 4000
  #     HOST: 0.0.0.0
  #   depends_on:
  #     - postgres
  #     - app

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: agent_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d agent_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  elasticsearch:
    image: elasticsearch:8.11.0
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    ports:
      - "9200:9200"
    volumes:
      - esdata:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9200/_cluster/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
  esdata:
